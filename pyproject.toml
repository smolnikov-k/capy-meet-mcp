[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capy-meet-mcp"
version = "1.0.2"
description = "CapyAgent Meet MCP: запись онлайн-встреч (Телемост, Google Meet, Zoom, Webex) и локальная расшифровка"
readme = "README.md"
authors = [{ name = "Smolnikov" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0,<2",
    "playwright==1.61.0",
    "faster-whisper==1.2.1",
]

[project.scripts]
capy-meet-mcp = "capy_meet_mcp.server:main"
capy-meet-worker = "capy_meet_mcp.worker:main"
capy-meet-doctor = "capy_meet_mcp.doctor:main"

[tool.setuptools.packages.find]
include = ["capy_meet_mcp*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
